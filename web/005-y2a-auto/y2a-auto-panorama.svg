<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="4876" viewBox="0 0 2400 4876"><rect width="100%" height="100%" fill="#f4f3ec"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="110" y="95" font-size="26" fill="#35533d" font-weight="700">OPEN SOURCE RESEARCH   /   005</text><text x="110" y="210" font-size="86" fill="#24372a" font-weight="700">Y2A-Auto 能力全景</text><text x="110" y="289" font-size="39" fill="#35533d" font-weight="400">把已有的 YouTube 视频，本地化处理后发布到 AcFun / bilibili</text><text x="110" y="352" font-size="29" fill="#596757" font-weight="400">自部署工具  ·  视频主体来自原内容  ·  源码已核对，实际运行效果待验证</text><rect x="110" y="400" width="520" height="112" rx="16" fill="#f4ded5"/><text x="145" y="454" font-size="38" fill="#a34534" font-weight="700">YouTube</text><text x="145" y="495" font-size="26" fill="#7a4e40" font-weight="400">手动链接 / 频道与关键词监控</text><text x="675" y="465" font-size="55" fill="#35533d" font-weight="400">→</text><rect x="800" y="400" width="720" height="112" rx="16" fill="#35533d"/><text x="840" y="455" font-size="38" fill="#ffffff" font-weight="700">Y2A-Auto</text><text x="1085" y="460" font-size="29" fill="#dfebc1" font-weight="400">处理 · 管理 · 发布</text><text x="1560" y="465" font-size="55" fill="#35533d" font-weight="400">→</text><rect x="1680" y="400" width="610" height="112" rx="16" fill="#dfe9e3"/><text x="1720" y="457" font-size="38" fill="#35533d" font-weight="700">AcFun / bilibili</text><text x="1720" y="497" font-size="25" fill="#596757" font-weight="400">单平台或双平台</text><text x="110" y="628" font-size="46" fill="#24372a" font-weight="700">01  一个任务怎样运行？</text><text x="1250" y="629" font-size="46" fill="#24372a" font-weight="700">02  围绕流水线的完整能力</text><text x="110" y="686" font-size="27" fill="#596757" font-weight="400">按主流程源码排序；各环节受配置与任务状态影响。</text><text x="1250" y="687" font-size="27" fill="#596757" font-weight="400">输入、处理、发布、后台和维护。</text><rect x="110" y="722" width="1050" height="173" rx="16" fill="#e9eddf"/><text x="138" y="773" font-size="30" fill="#35533d" font-weight="700">01</text><text x="218" y="776" font-size="35" fill="#24372a" font-weight="700">添加任务</text><text x="218" y="828" font-size="29" fill="#596757" font-weight="400">手动添加 YouTube 链接，或由频道／关键词监控发现视频后自动入队</text><text x="218" y="852" font-size="29" fill="#596757" font-weight="400">。</text><text x="139" y="915" font-size="25" fill="#35533d" font-weight="400">↓</text><rect x="110" y="922" width="1050" height="173" rx="16" fill="#e9eddf"/><text x="138" y="973" font-size="30" fill="#35533d" font-weight="700">02</text><text x="218" y="976" font-size="35" fill="#24372a" font-weight="700">采集信息与处理文案</text><text x="218" y="1028" font-size="29" fill="#596757" font-weight="400">先取元数据与封面；按开关翻译标题、简介，生成或应用标签，推荐分</text><text x="218" y="1070" font-size="29" fill="#596757" font-weight="400">区。</text><text x="139" y="1115" font-size="25" fill="#35533d" font-weight="400">↓</text><rect x="110" y="1122" width="1050" height="173" rx="16" fill="#e9eddf"/><text x="138" y="1173" font-size="30" fill="#35533d" font-weight="700">03</text><text x="218" y="1176" font-size="35" fill="#24372a" font-weight="700">可选文本审核</text><text x="218" y="1229" font-size="29" fill="#596757" font-weight="400">检查标题、简介、标签；未通过时进入人工审核。此时还未下载完整视</text><text x="218" y="1271" font-size="29" fill="#596757" font-weight="400">频。</text><text x="139" y="1315" font-size="25" fill="#35533d" font-weight="400">↓</text><rect x="110" y="1322" width="1050" height="173" rx="16" fill="#e9eddf"/><text x="138" y="1373" font-size="30" fill="#35533d" font-weight="700">04</text><text x="218" y="1376" font-size="35" fill="#24372a" font-weight="700">下载视频</text><text x="218" y="1429" font-size="29" fill="#596757" font-weight="400">yt-dlp 获取视频及相关资源；已有阶段检查点可用于跳过完成的工作。</text><text x="139" y="1515" font-size="25" fill="#35533d" font-weight="400">↓</text><rect x="110" y="1522" width="1050" height="173" rx="16" fill="#e9eddf"/><text x="138" y="1573" font-size="30" fill="#35533d" font-weight="700">05</text><text x="218" y="1577" font-size="35" fill="#24372a" font-weight="700">字幕本地化</text><text x="218" y="1629" font-size="29" fill="#596757" font-weight="400">复用已有字幕，或按需调用 ASR；再按配置进行翻译、整理与质量检</text><text x="218" y="1672" font-size="29" fill="#596757" font-weight="400">查。</text><text x="139" y="1715" font-size="25" fill="#35533d" font-weight="400">↓</text><rect x="110" y="1722" width="1050" height="173" rx="16" fill="#e9eddf"/><text x="138" y="1773" font-size="30" fill="#35533d" font-weight="700">06</text><text x="218" y="1777" font-size="35" fill="#24372a" font-weight="700">字幕烧录与转码</text><text x="218" y="1829" font-size="29" fill="#596757" font-weight="400">FFmpeg 处理编码与烧录；烧录前结合字幕质量状态和配置决定是否</text><text x="218" y="1873" font-size="29" fill="#596757" font-weight="400">放行。</text><text x="139" y="1915" font-size="25" fill="#35533d" font-weight="400">↓</text><rect x="110" y="1922" width="1050" height="173" rx="16" fill="#e9eddf"/><text x="138" y="1973" font-size="30" fill="#35533d" font-weight="700">07</text><text x="218" y="1976" font-size="35" fill="#24372a" font-weight="700">上传与反馈</text><text x="218" y="2029" font-size="29" fill="#596757" font-weight="400">自动模式上传，否则停在准备上传；记录平台结果，并按配置发送事件</text><text x="218" y="2072" font-size="29" fill="#596757" font-weight="400">通知。</text><rect x="1250" y="722" width="1040" height="204" rx="16" fill="#ffffff" stroke="#cdd5c2" stroke-width="2"/><text x="1282" y="778" font-size="35" fill="#35533d" font-weight="700">输入与监控</text><text x="1282" y="834" font-size="29" fill="#596757" font-weight="400">链接、频道／关键词；最新／历史模式；视频类型筛选；YouTube Cookies </text><text x="1282" y="878" font-size="29" fill="#596757" font-weight="400">与可选 CookieCloud 同步。</text><rect x="1250" y="952" width="1040" height="204" rx="16" fill="#ffffff" stroke="#cdd5c2" stroke-width="2"/><text x="1282" y="1009" font-size="35" fill="#35533d" font-weight="700">字幕与 AI</text><text x="1282" y="1065" font-size="29" fill="#596757" font-weight="400">Whisper／Voxtral API；字幕翻译、断句、时间轴整理、质量检查；生成标</text><text x="1282" y="1108" font-size="29" fill="#596757" font-weight="400">题、简介、标签和分区建议。</text><rect x="1250" y="1182" width="1040" height="204" rx="16" fill="#ffffff" stroke="#cdd5c2" stroke-width="2"/><text x="1282" y="1238" font-size="35" fill="#35533d" font-weight="700">媒体处理</text><text x="1282" y="1295" font-size="29" fill="#596757" font-weight="400">FFmpeg；CPU／NVIDIA／Intel／AMD 编码；优先 HEVC，失败可回退 H.</text><text x="1282" y="1339" font-size="29" fill="#596757" font-weight="400">264；可选字幕烧录。</text><rect x="1250" y="1412" width="1040" height="204" rx="16" fill="#ffffff" stroke="#cdd5c2" stroke-width="2"/><text x="1282" y="1468" font-size="35" fill="#35533d" font-weight="700">账号与平台发布</text><text x="1282" y="1524" font-size="29" fill="#596757" font-weight="400">AcFun／bilibili 扫码登录；B 站 Cookie 导入；单平台或双平台发布；各平</text><text x="1282" y="1569" font-size="29" fill="#596757" font-weight="400">台上传结果单独记录。</text><rect x="1250" y="1642" width="1040" height="204" rx="16" fill="#ffffff" stroke="#cdd5c2" stroke-width="2"/><text x="1282" y="1698" font-size="35" fill="#35533d" font-weight="700">Web 后台与维护</text><text x="1282" y="1755" font-size="29" fill="#596757" font-weight="400">设置中心、任务状态、人工处理、并发控制、日志与下载清理；可查看进度</text><text x="1282" y="1798" font-size="29" fill="#596757" font-weight="400">与失败信息。</text><rect x="1250" y="1872" width="1040" height="204" rx="16" fill="#ffffff" stroke="#cdd5c2" stroke-width="2"/><text x="1282" y="1928" font-size="35" fill="#35533d" font-weight="700">事件通知</text><text x="1282" y="1985" font-size="29" fill="#596757" font-weight="400">企业微信、Server酱、message-pusher；任务与登录等事件；持久化发送</text><text x="1282" y="2028" font-size="29" fill="#596757" font-weight="400">队列及失败重试。</text><rect x="110" y="2132" width="2180" height="117" rx="16" fill="#35533d"/><text x="143" y="2183" font-size="32" fill="#dfebc1" font-weight="700">三个概念要分清</text><text x="143" y="2235" font-size="31" fill="#ffffff" font-weight="400">ASR：声音 → 文字     /     翻译：原语言 → 目标语言     /     烧录：字幕 → 写入画面</text><text x="110" y="2333" font-size="25" fill="#35533d" font-weight="700">03</text><text x="180" y="2348" font-size="47" fill="#24372a" font-weight="700">底层原理：用任务系统组织处理工具</text><rect x="110" y="2402" width="2180" height="89" rx="16" fill="#e9eddf"/><text x="143" y="2453" font-size="30" fill="#35533d" font-weight="700">管理入口</text><text x="410" y="2455" font-size="30" fill="#24372a" font-weight="400">Flask Web 后台：配置、任务、审核、日志</text><rect x="110" y="2503" width="2180" height="89" rx="16" fill="#eeeee5"/><text x="143" y="2554" font-size="30" fill="#35533d" font-weight="700">任务编排</text><text x="410" y="2556" font-size="30" fill="#24372a" font-weight="400">任务管理器：状态、并发额度、阶段检查点、上传结果</text><rect x="110" y="2604" width="2180" height="89" rx="16" fill="#e9eddf"/><text x="143" y="2655" font-size="30" fill="#35533d" font-weight="700">执行工具</text><text x="410" y="2657" font-size="30" fill="#24372a" font-weight="400">yt-dlp 获取媒体  /  AI 与 ASR API 处理语言  /  FFmpeg 处理音视频</text><rect x="110" y="2705" width="2180" height="89" rx="16" fill="#eeeee5"/><text x="143" y="2756" font-size="30" fill="#35533d" font-weight="700">结果与存储</text><text x="410" y="2757" font-size="30" fill="#24372a" font-weight="400">AcFun／bilibili 上传模块；SQLite 任务与通知；本地配置、媒体、日志</text><text x="110" y="2842" font-size="28" fill="#596757" font-weight="400">本版本语音识别通过可配置 API 接入；本机 GPU 编码与语音识别服务是两件事。</text><text x="110" y="2934" font-size="25" fill="#35533d" font-weight="700">04</text><text x="180" y="2949" font-size="47" fill="#24372a" font-weight="700">四个值得借鉴的工程机制</text><rect x="110" y="3003" width="1040" height="180" rx="16" fill="#e9eddf"/><text x="142" y="3057" font-size="35" fill="#35533d" font-weight="700">阶段检查点</text><text x="142" y="3115" font-size="29" fill="#596757" font-weight="400">记录完成的步骤，重跑时可跳过；避免所有失败都从头处理。</text><rect x="1250" y="3003" width="1040" height="180" rx="16" fill="#e9eddf"/><text x="1282" y="3058" font-size="35" fill="#35533d" font-weight="700">字幕质量门控</text><text x="1282" y="3115" font-size="29" fill="#596757" font-weight="400">区分识别失败、质检不合格、质检不可用；实际放行行为受配置影响。</text><rect x="110" y="3208" width="1040" height="180" rx="16" fill="#e9eddf"/><text x="142" y="3264" font-size="35" fill="#35533d" font-weight="700">部分成功恢复</text><text x="142" y="3320" font-size="29" fill="#596757" font-weight="400">分别保留平台响应；双平台部分成功后，可只重试尚未成功的平台。</text><rect x="1250" y="3208" width="1040" height="180" rx="16" fill="#e9eddf"/><text x="1282" y="3262" font-size="35" fill="#35533d" font-weight="700">通知独立投递</text><text x="1282" y="3320" font-size="29" fill="#596757" font-weight="400">SQLite outbox 保存消息 → 后台投递 → 递增间隔重试 → 超限记录失败。</text><text x="110" y="3447" font-size="28" fill="#596757" font-weight="400">这些是源码中可见的机制，不等于已经验证生产稳定性、并发容量或恢复效果。</text><text x="110" y="3561" font-size="46" fill="#24372a" font-weight="700">05  对我们的意义</text><text x="1250" y="3561" font-size="46" fill="#24372a" font-weight="700">06  运行条件与使用边界</text><text x="110" y="3640" font-size="33" fill="#35533d" font-weight="700">自有视频跨语言分发</text><text x="110" y="3701" font-size="30" fill="#596757" font-weight="400">减少字幕、发布文案与平台上传之间的重复操作。</text><text x="110" y="3780" font-size="33" fill="#35533d" font-weight="700">获授权课程／访谈本地化</text><text x="110" y="3840" font-size="30" fill="#596757" font-weight="400">自动处理重复环节，人工复核术语、时间轴与最终内容。</text><text x="110" y="3921" font-size="33" fill="#35533d" font-weight="700">内容工具的工程参考</text><text x="110" y="3980" font-size="30" fill="#596757" font-weight="400">借鉴检查点、人工介入、状态管理和部分失败恢复设计。</text><text x="110" y="4058" font-size="29" fill="#596757" font-weight="400">与 BrightBean Studio 的侧重点不同：它面向多平台发布与运营；Y2A-Auto 更集</text><text x="110" y="4102" font-size="29" fill="#596757" font-weight="400">中于视频本地化及 A/B 站输出。尚未验证直接集成。</text><text x="1250" y="3640" font-size="32" fill="#35533d" font-weight="700">需要准备</text><text x="1250" y="3693" font-size="29" fill="#596757" font-weight="400">Docker 或本地运行环境、网络与存储、平台账号状态、FFmpeg；启用 AI／ASR</text><text x="1250" y="3737" font-size="29" fill="#596757" font-weight="400">／审核时配置相应服务。</text><text x="1250" y="3808" font-size="32" fill="#35533d" font-weight="700">按需选用</text><text x="1250" y="3862" font-size="29" fill="#596757" font-weight="400">CookieCloud、云审核与 GPU 并非统一必需条件；字幕翻译、烧录、审核、自动</text><text x="1250" y="3906" font-size="29" fill="#596757" font-weight="400">上传分别有开关。</text><text x="1250" y="3977" font-size="32" fill="#35533d" font-weight="700">能力边界</text><text x="1250" y="4031" font-size="29" fill="#596757" font-weight="400">不等于新视频生成、复杂剪辑或配音工具；已确认目标平台仅 AcFun／bilibili。</text><text x="1250" y="4102" font-size="32" fill="#35533d" font-weight="700">审核边界</text><text x="1250" y="4156" font-size="29" fill="#596757" font-weight="400">当前主流程检测标题、简介、标签，封面检测被跳过；不能等同整段视频审核。</text><text x="1250" y="4200" font-size="29" fill="#596757" font-weight="400">使用自有或已获授权素材。</text><text x="110" y="4309" font-size="25" fill="#35533d" font-weight="700">07</text><text x="180" y="4324" font-size="47" fill="#24372a" font-weight="700">研究证据与尚待验证的部分</text><rect x="110" y="4378" width="2180" height="280" rx="16" fill="#35533d"/><text x="145" y="4436" font-size="34" fill="#dfebc1" font-weight="700">已核对</text><text x="350" y="4436" font-size="30" fill="#ffffff" font-weight="400">上游说明、任务主流程、ASR 接入、字幕处理与质检、通知持久化及重试机制。</text><text x="145" y="4525" font-size="34" fill="#dfebc1" font-weight="700">待实测</text><text x="350" y="4524" font-size="30" fill="#ffffff" font-weight="400">真实字幕准确性、API 成本、处理耗时、平台上传成功率、失败恢复效果。</text><text x="145" y="4623" font-size="32" fill="#ffffff" font-weight="700">本次为源码研究：未运行上游服务，未连接真实账号。</text><text x="110" y="4726" font-size="28" fill="#35533d" font-weight="700">来源  github.com/fqscfqj/Y2A-Auto</text><text x="1250" y="4726" font-size="27" fill="#596757" font-weight="400">核对  2026-09-21   /   版本  14dc78cf5380</text><text x="110" y="4784" font-size="24" fill="#596757" font-weight="400">依据：README · task_manager · speech_recognition · subtitle_translator · subtitle_qc · notifications/service</text></g></svg>