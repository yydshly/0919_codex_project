<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#e7ebde"/><g font-family="Microsoft YaHei, sans-serif" fill="#283e30"><text x="70" y="92" font-size="20" letter-spacing="3">RESEARCH 005 / Y2A-AUTO</text><text x="70" y="185" font-size="52" font-weight="600">从视频，到本地化发布。</text><text x="70" y="245" font-size="23">YouTube → 文案与文本审核 → 下载与字幕处理 → AcFun / bilibili</text><rect x="70" y="330" width="1260" height="150" rx="8" fill="#35533d"/><g fill="#ffffff" font-size="24"><text x="110" y="395">任务接入 → 采集与文案 → 可选文本审核 → 下载视频</text><text x="110" y="448">→ 字幕本地化 → 烧录与转码 → 单平台或双平台上传</text></g><text x="70" y="560" font-size="23">阶段检查点 · 字幕质量门控 · 人工介入 · 部分成功恢复</text><text x="70" y="635" font-size="19" fill="#616a61">按源码主流程整理；步骤受配置影响。本研究未运行上游服务。</text><text x="70" y="690" font-size="17" fill="#616a61">2026-09-21 · 14dc78cf5380</text></g></svg>