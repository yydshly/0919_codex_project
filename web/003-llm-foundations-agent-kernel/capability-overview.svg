<title id="title">Foundations-of-LLMs 与 Agent-Kernel 完整能力总览</title><desc id="desc">左侧为大模型基础教材六章核心内容、方法和学习价值；右侧为多智能体框架架构、能力价值、使用场景、可视化和数据输出，以及运行条件。实际功能依据官方文档；未运行上游模拟。</desc>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",sans-serif}</style>
<rect x="0" y="0" width="2000" height="2670" rx="0" fill="#f3f6fb"/>
<rect x="0" y="0" width="2000" height="267" rx="0" fill="#101e33"/>
<text x="64" y="60" font-size="20" fill="#b8c9e1" font-weight="600">OPEN SOURCE RESEARCH / 003</text>
<text x="1550" y="60" font-size="20" fill="#b8c9e1" font-weight="400">ZJU-LLMs · 2026.09.20</text>
<text x="64" y="137" font-size="58" fill="#ffffff" font-weight="600">大模型教材 × AI 群体模拟</text>
<text x="66" y="195" font-size="27" fill="#cedbed" font-weight="400">一张图看懂：学什么、能做什么、为什么有用，以及最后能看到什么。</text>
<text x="66" y="237" font-size="22" fill="#9dc5ed" font-weight="400">知识与方法 → 帮你做判断                         角色与环境 → 帮你做模拟实验</text>
<rect x="64" y="302" width="920" height="2000" rx="16" fill="#ffffff" stroke="#d8e2ef"/>
<rect x="1016" y="302" width="920" height="2000" rx="16" fill="#ffffff" stroke="#d8e2ef"/>
<rect x="64" y="302" width="920" height="9" rx="4" fill="#2457cd"/>
<rect x="1016" y="302" width="920" height="9" rx="4" fill="#087366"/>
<text x="96" y="355" font-size="21" fill="#2457cd" font-weight="600">A / 开源教材</text>
<text x="96" y="405" font-size="39" fill="#15273f" font-weight="600">Foundations-of-LLMs</text>
<text x="96" y="447" font-size="25" fill="#56677d" font-weight="400">理解模型原理，学习使用与适配大模型的方法。</text>
<text x="96" y="484" font-size="21" fill="#2457cd" font-weight="600">核心模块：按官方目录整理的六个章节</text>
<rect x="96" y="510" width="856" height="146" rx="9" fill="#f3f6fc"/>
<text x="116" y="547" font-size="21" fill="#2457cd" font-weight="600">01</text>
<text x="167" y="548" font-size="27" fill="#15273f" font-weight="600">语言模型基础</text>
<text x="167" y="583" font-size="22" fill="#56677d" font-weight="400">统计语言模型 · RNN · Transformer</text>
<text x="167" y="615" font-size="22" fill="#56677d" font-weight="400">采样方法 · 效果评测</text>
<text x="167" y="643" font-size="21" fill="#2457cd" font-weight="400">理解：文字怎样生成，回答怎样评价。</text>
<rect x="96" y="670" width="856" height="146" rx="9" fill="#f3f6fc"/>
<text x="116" y="707" font-size="21" fill="#2457cd" font-weight="600">02</text>
<text x="167" y="708" font-size="27" fill="#15273f" font-weight="600">大语言模型</text>
<text x="167" y="743" font-size="22" fill="#56677d" font-weight="400">数据与规模 · 架构概览 · 编码器型模型</text>
<text x="167" y="775" font-size="22" fill="#56677d" font-weight="400">编码器—解码器型 · 解码器型 · 非 Transformer</text>
<text x="167" y="803" font-size="21" fill="#2457cd" font-weight="400">理解：不同架构的特点与演进路线。</text>
<rect x="96" y="830" width="856" height="146" rx="9" fill="#f3f6fc"/>
<text x="116" y="867" font-size="21" fill="#2457cd" font-weight="600">03</text>
<text x="167" y="868" font-size="27" fill="#15273f" font-weight="600">Prompt 工程</text>
<text x="167" y="903" font-size="22" fill="#56677d" font-weight="400">基本概念 · 上下文学习 · 思维链</text>
<text x="167" y="935" font-size="22" fill="#56677d" font-weight="400">提示技巧 · 相关应用</text>
<text x="167" y="963" font-size="21" fill="#2457cd" font-weight="400">应用：交代目标、背景、示例和输出要求。</text>
<rect x="96" y="990" width="856" height="146" rx="9" fill="#f3f6fc"/>
<text x="116" y="1027" font-size="21" fill="#2457cd" font-weight="600">04</text>
<text x="167" y="1028" font-size="27" fill="#15273f" font-weight="600">参数高效微调</text>
<text x="167" y="1063" font-size="22" fill="#56677d" font-weight="400">基本概念 · 参数附加 · 参数选择</text>
<text x="167" y="1095" font-size="22" fill="#56677d" font-weight="400">低秩适配（如 LoRA）· 实践与应用</text>
<text x="167" y="1123" font-size="21" fill="#2457cd" font-weight="400">应用：用较少可训练参数适配具体任务。</text>
<rect x="96" y="1150" width="856" height="146" rx="9" fill="#f3f6fc"/>
<text x="116" y="1187" font-size="21" fill="#2457cd" font-weight="600">05</text>
<text x="167" y="1188" font-size="27" fill="#15273f" font-weight="600">模型编辑</text>
<text x="167" y="1223" font-size="22" fill="#56677d" font-weight="400">基本概念 · 经典方法 · 应用</text>
<text x="167" y="1255" font-size="22" fill="#56677d" font-weight="400">附加参数 T-Patcher · 定位编辑 ROME</text>
<text x="167" y="1283" font-size="21" fill="#2457cd" font-weight="400">研究：针对性修改知识，并检查副作用。</text>
<rect x="96" y="1310" width="856" height="146" rx="9" fill="#f3f6fc"/>
<text x="116" y="1347" font-size="21" fill="#2457cd" font-weight="600">06</text>
<text x="167" y="1348" font-size="27" fill="#15273f" font-weight="600">检索增强生成 · RAG</text>
<text x="167" y="1383" font-size="22" fill="#56677d" font-weight="400">基本概念 · 系统架构 · 知识检索</text>
<text x="167" y="1415" font-size="22" fill="#56677d" font-weight="400">生成增强 · 实践与应用</text>
<text x="167" y="1443" font-size="21" fill="#2457cd" font-weight="400">应用：找到相关资料，再让模型参考作答。</text>
<text x="96" y="1530" font-size="19" fill="#2457cd" font-weight="600">A1</text>
<text x="144" y="1531" font-size="28" fill="#15273f" font-weight="600">最实用的三种方法，分别改什么？</text>
<rect x="96" y="1570" width="856" height="55" rx="7" fill="#eef3ff"/>
<text x="115" y="1606" font-size="24" fill="#2457cd" font-weight="600">Prompt</text>
<text x="258" y="1606" font-size="24" fill="#15273f" font-weight="400">改输入：任务、上下文、示例</text>
<rect x="96" y="1637" width="856" height="55" rx="7" fill="#eef3ff"/>
<text x="115" y="1673" font-size="24" fill="#2457cd" font-weight="600">RAG</text>
<text x="258" y="1673" font-size="24" fill="#15273f" font-weight="400">补资料：检索外部知识，供回答参考</text>
<rect x="96" y="1704" width="856" height="55" rx="7" fill="#eef3ff"/>
<text x="115" y="1740" font-size="24" fill="#2457cd" font-weight="600">微调</text>
<text x="258" y="1740" font-size="24" fill="#15273f" font-weight="400">改参数：通过训练适应特定任务</text>
<text x="96" y="1844" font-size="19" fill="#2457cd" font-weight="600">A2</text>
<text x="144" y="1845" font-size="28" fill="#15273f" font-weight="600">读完以后，你真正获得什么？</text>
<text x="96" y="1890" font-size="24" fill="#15273f" font-weight="400">提要求：把“帮我做”变成可理解、可验收的任务。</text>
<text x="96" y="1934" font-size="24" fill="#15273f" font-weight="400">找原因：分清指令不清、资料不足与能力限制。</text>
<text x="96" y="1978" font-size="24" fill="#15273f" font-weight="400">选方法：判断补资料、改提示词或训练是否合适。</text>
<rect x="96" y="2010" width="856" height="130" rx="10" fill="#101e33"/>
<text x="119" y="2052" font-size="20" fill="#b6c8e3" font-weight="400">建议阅读路线 / 面向实际应用</text>
<text x="119" y="2098" font-size="24" fill="#fff" font-weight="600">第 3 章 → 第 6 章 → 回查 1、2 章 → 按需读 4、5 章</text>
<text x="96" y="2195" font-size="24" fill="#15273f" font-weight="400">交付形式：整本 / 分章 PDF + 相关论文资料。</text>
<text x="96" y="2233" font-size="23" fill="#56677d" font-weight="400">适合：AI 学习、日常提效、应用开发的知识准备。</text>
<text x="96" y="2270" font-size="22" fill="#56677d" font-weight="400">它提供学习材料；实际系统仍需另外实现与验证。</text>
<text x="1048" y="355" font-size="21" fill="#087366" font-weight="600">B / 多智能体开发框架</text>
<text x="1048" y="405" font-size="39" fill="#15273f" font-weight="600">Agent-Kernel</text>
<text x="1048" y="447" font-size="25" fill="#56677d" font-weight="400">用大模型扮演个体，在共同环境里观察群体互动。</text>
<text x="1048" y="502" font-size="19" fill="#087366" font-weight="600">B1</text>
<text x="1096" y="503" font-size="28" fill="#15273f" font-weight="600">底层结构：模型思考，系统管理，场景定规则</text>
<rect x="1048" y="533" width="163" height="87" rx="7" fill="#edf7f4" stroke="#cee6df"/>
<text x="1060" y="567" font-size="19" fill="#087366" font-weight="600">Agent</text>
<text x="1060" y="600" font-size="21" fill="#15273f" font-weight="400">角色与决策</text>
<rect x="1221" y="533" width="163" height="87" rx="7" fill="#edf7f4" stroke="#cee6df"/>
<text x="1233" y="567" font-size="19" fill="#087366" font-weight="600">Environment</text>
<text x="1233" y="600" font-size="21" fill="#15273f" font-weight="400">环境与状态</text>
<rect x="1394" y="533" width="163" height="87" rx="7" fill="#edf7f4" stroke="#cee6df"/>
<text x="1406" y="567" font-size="19" fill="#087366" font-weight="600">Action</text>
<text x="1406" y="600" font-size="21" fill="#15273f" font-weight="400">行动与执行</text>
<rect x="1567" y="533" width="163" height="87" rx="7" fill="#edf7f4" stroke="#cee6df"/>
<text x="1579" y="567" font-size="19" fill="#087366" font-weight="600">Controller</text>
<text x="1579" y="600" font-size="21" fill="#15273f" font-weight="400">干预与控制</text>
<rect x="1740" y="533" width="163" height="87" rx="7" fill="#edf7f4" stroke="#cee6df"/>
<text x="1752" y="567" font-size="19" fill="#087366" font-weight="600">System</text>
<text x="1752" y="600" font-size="21" fill="#15273f" font-weight="400">系统管理</text>
<text x="1048" y="657" font-size="23" fill="#56677d" font-weight="400">微内核：插件注册、行为校验、异步通信等通用机制。</text>
<text x="1048" y="693" font-size="23" fill="#56677d" font-weight="400">插件：实现具体角色、环境与动作，支持跨场景复用。</text>
<rect x="1048" y="719" width="856" height="132" rx="9" fill="#101e33"/>
<text x="1071" y="759" font-size="20" fill="#b8cce3" font-weight="400">一次互动的概念流程</text>
<text x="1071" y="802" font-size="24" fill="#d6fff3" font-weight="600">感知 → 决策 → 校验 → 执行 → 环境变化 → 再感知</text>
<text x="1048" y="886" font-size="23" fill="#087366" font-weight="400">你准备：角色身份 / 模型接口 / 环境规则 / 实验条件</text>
<text x="1048" y="947" font-size="19" fill="#087366" font-weight="600">B2</text>
<text x="1096" y="948" font-size="28" fill="#15273f" font-weight="600">核心价值：把群体互动变成可干预的实验</text>
<text x="1048" y="992" font-size="24" fill="#087366" font-weight="600">动态群体</text>
<text x="1173" y="992" font-size="23" fill="#15273f" font-weight="400">运行中增减角色、修改环境与行为。</text>
<text x="1048" y="1041" font-size="24" fill="#087366" font-weight="600">实验干预</text>
<text x="1173" y="1041" font-size="23" fill="#15273f" font-weight="400">调整条件、触发事件，比较不同设定。</text>
<text x="1048" y="1090" font-size="24" fill="#087366" font-weight="600">行为约束</text>
<text x="1173" y="1090" font-size="23" fill="#15273f" font-weight="400">按设定规则检查行动，再执行并更新状态。</text>
<text x="1048" y="1139" font-size="24" fill="#087366" font-weight="600">开发复用</text>
<text x="1173" y="1139" font-size="23" fill="#15273f" font-weight="400">复用插件；提供单机与分布式运行路径。</text>
<text x="1048" y="1200" font-size="19" fill="#087366" font-weight="600">B3</text>
<text x="1096" y="1201" font-size="28" fill="#15273f" font-weight="600">适用场景：官方已经展示哪些方向？</text>
<rect x="1048" y="1227" width="856" height="69" rx="7" fill="#f1f7f5"/>
<text x="1067" y="1256" font-size="23" fill="#087366" font-weight="600">校园生活</text>
<text x="1067" y="1284" font-size="22" fill="#15273f" font-weight="400">人员流动、资源使用、社会互动。</text>
<rect x="1048" y="1306" width="856" height="69" rx="7" fill="#f1f7f5"/>
<text x="1067" y="1335" font-size="23" fill="#087366" font-weight="600">Universe 25</text>
<text x="1067" y="1363" font-size="22" fill="#15273f" font-weight="400">群体规模、社会结构与行为动态。</text>
<rect x="1048" y="1385" width="856" height="69" rx="7" fill="#f1f7f5"/>
<text x="1067" y="1414" font-size="23" fill="#087366" font-weight="600">OpenHospital</text>
<text x="1067" y="1442" font-size="22" fill="#15273f" font-weight="400">医生与患者互动、协作流程与能力评测。</text>
<text x="1048" y="1504" font-size="19" fill="#087366" font-weight="600">B4</text>
<text x="1096" y="1505" font-size="28" fill="#15273f" font-weight="600">效果呈现：最后可以看见或拿到什么？</text>
<rect x="1048" y="1533" width="856" height="130" rx="8" fill="#f3f6fa"/>
<text x="1068" y="1567" font-size="25" fill="#15273f" font-weight="600">运行面板 / Society-Panel</text>
<text x="1068" y="1606" font-size="22" fill="#15273f" font-weight="400">配置与启动 / 停止模拟；查看运行状态、事件日志。</text>
<text x="1068" y="1640" font-size="20" fill="#56677d" font-weight="400">通用控制面板，目前仅支持分布式版。</text>
<rect x="1048" y="1675" width="856" height="130" rx="8" fill="#f3f6fa"/>
<text x="1068" y="1709" font-size="25" fill="#15273f" font-weight="600">过程回放 / OpenHospital 示例</text>
<text x="1068" y="1748" font-size="22" fill="#15273f" font-weight="400">通过前端查看角色活动与患者轨迹，支持离线日志回放。</text>
<text x="1068" y="1782" font-size="20" fill="#56677d" font-weight="400">具体场景负责可视化，不是所有场景自带地图动画。</text>
<rect x="1048" y="1817" width="856" height="130" rx="8" fill="#f3f6fa"/>
<text x="1068" y="1851" font-size="25" fill="#15273f" font-weight="600">实验数据 / OpenHospital 示例</text>
<text x="1068" y="1890" font-size="22" fill="#15273f" font-weight="400">导出 JSON 与日志；可选 PostgreSQL 保存轨迹。</text>
<text x="1068" y="1924" font-size="20" fill="#56677d" font-weight="400">记录事件和互动过程，为复盘与评测提供依据。</text>
<rect x="1048" y="1959" width="856" height="130" rx="8" fill="#f3f6fa"/>
<text x="1068" y="1993" font-size="25" fill="#15273f" font-weight="600">量化评测 / OpenHospital 示例</text>
<text x="1068" y="2032" font-size="22" fill="#15273f" font-weight="400">检查合理性、诊断准确性、治疗方案对齐与输入 token 成本。</text>
<text x="1068" y="2066" font-size="20" fill="#56677d" font-weight="400">指标依赖数据、标准答案与完整事件记录；本图无实测数值。</text>
<text x="1048" y="2162" font-size="23" fill="#15273f" font-weight="400">使用条件：Python、模型服务、场景代码与所需存储。</text>
<text x="1048" y="2202" font-size="23" fill="#15273f" font-weight="400">适合：科研、教学、虚拟社会与多角色协作评测。</text>
<text x="1048" y="2240" font-size="21" fill="#56677d" font-weight="400">成本由模型调用与规模决定；多角色不等于多个本地模型。</text>
<text x="1048" y="2276" font-size="21" fill="#56677d" font-weight="400">规则校验不保证现实有效性，也不保证群体一定更聪明。</text>
<rect x="64" y="2335" width="1872" height="170" rx="12" fill="#e5edf9"/>
<text x="93" y="2380" font-size="27" fill="#2457cd" font-weight="600">对你的意义</text>
<text x="93" y="2426" font-size="27" fill="#15273f" font-weight="600">想把 AI 用好 → 从教材的提示词与 RAG 开始。</text>
<text x="1021" y="2426" font-size="27" fill="#15273f" font-weight="600">想观察 AI 群体 → 用框架搭建并检验一个小场景。</text>
<text x="93" y="2470" font-size="23" fill="#56677d" font-weight="400">两者关系：教材首页关联推荐框架；学习可以帮助开发，但阅读整本教材不是运行框架的必要条件。</text>
<text x="64" y="2549" font-size="21" fill="#56677d" font-weight="400">来源：两库官方 README / 教材目录；Agent-Kernel 的 Society-Panel、OpenHospital 文档与论文。</text>
