<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172942"><title>Frappe HR · 完整能力总览图</title>
<style>*{box-sizing:border-box}body{margin:0;background:#edf1f7;color:#243b59;font-family:"Segoe UI","Microsoft YaHei",sans-serif}header{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 24px;background:#fff;border-bottom:1px solid #dce5f0;font-size:14px}header>div{display:flex;gap:14px;align-items:center;flex-wrap:wrap}a{color:#2859a7;text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;border:1px solid #cfdaea;border-radius:5px;background:#fff;color:#355783;padding:6px 10px;cursor:pointer}a:focus-visible,button:focus-visible{outline:3px solid #6c96dc;outline-offset:3px}main{padding:12px;display:flex;justify-content:center;align-items:flex-start}.poster{display:block;max-width:100%;width:auto;height:auto;max-height:calc(100dvh - 94px);box-shadow:0 8px 35px #243a6114}body.zoom main{display:block;overflow:auto}body.zoom .poster{max-width:none;max-height:none;width:1600px;height:1140px;margin:auto}@media(max-width:600px){header{padding:12px;font-size:12px}main{padding:8px}.poster{max-height:none;width:100%}header strong{width:100%}}@media print{header{display:none}main{padding:0}.poster{max-height:none;max-width:100%;box-shadow:none}@page{size:landscape;margin:6mm}}</style></head>
<body><header><strong>Frappe HR · 业务 × 技术 × 学习价值</strong><div><a href="index.html#map">← 返回研究页</a><button id="zoom" type="button" aria-pressed="false">原尺寸阅读</button><a href="capability-map.svg" download="frappe-hr-capability-map.svg">下载 SVG</a><a href="capability-map.png" download="frappe-hr-capability-map.png">下载 PNG</a></div></header><main><img class="poster" src="capability-map.svg" alt="Frappe HR 完整能力总览，含六组二十四个维度：业务与数据、身份与权限、流程与可信、时间与规则、界面与连接、运行与演进；每组对应业务能力、技术实现和学习价值。"></main><script>document.getElementById('zoom').addEventListener('click',event=>{const zoom=document.body.classList.toggle('zoom');event.currentTarget.setAttribute('aria-pressed',String(zoom));event.currentTarget.textContent=zoom?'适应窗口':'原尺寸阅读';});</script></body>
</html>
