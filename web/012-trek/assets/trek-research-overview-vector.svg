<text x="2522" y="986" font-size="32" fill="#5B6C79">13 个精选地点、7 个图上热点、真实地图</text>
<text x="2522" y="1030" font-size="32" fill="#5B6C79">规则推荐、三日安排、导航入口、保存到 TREK</text>
<text x="2522" y="1074" font-size="32" fill="#5B6C79">旧图仍有方位问题；热点为手工关联</text>
