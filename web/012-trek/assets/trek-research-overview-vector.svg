<text x="142" y="965" font-size="36" fill="#286593" class="bold">行程与路线</text>
<text x="142" y="1019" font-size="32" fill="#5B6C79">分日安排、住宿与交通、拖拽调整</text>
<text x="142" y="1063" font-size="32" fill="#5B6C79">顺序优化、道路路线</text>
<line x1="142" y1="1106" x2="1138" y2="1106" stroke="#D8DFDF" stroke-width="2"/>
<text x="142" y="1156" font-size="36" fill="#286593" class="bold">旅途事务</text>
<text x="142" y="1210" font-size="32" fill="#5B6C79">预订资料与附件、行李清单、待办任务</text>
<line x1="142" y1="1297" x2="1138" y2="1297" stroke="#D8DFDF" stroke-width="2"/>
<text x="142" y="1347" font-size="36" fill="#286593" class="bold">费用与协作</text>
<text x="142" y="1401" font-size="32" fill="#5B6C79">多币种分账、成员权限</text>
<text x="142" y="1445" font-size="32" fill="#5B6C79">实时协作、分享</text>
<line x1="142" y1="1488" x2="1138" y2="1488" stroke="#D8DFDF" stroke-width="2"/>
<text x="142" y="1538" font-size="36" fill="#286593" class="bold">记录与输出</text>
<text x="142" y="1592" font-size="32" fill="#5B6C79">旅行日记、到访统计、离线资料</text>
<text x="142" y="1636" font-size="32" fill="#5B6C79">PDF / GPX / ICS / CSV</text>
<line x1="142" y1="1679" x2="1138" y2="1679" stroke="#D8DFDF" stroke-width="2"/>
<text x="142" y="1729" font-size="36" fill="#286593" class="bold">扩展与日常辅助</text>
<text x="142" y="1783" font-size="32" fill="#5B6C79">插件、公共 API、MCP</text>
<text x="142" y="1827" font-size="32" fill="#5B6C79">天气、日历、通知；AI 辅助导入需配置</text>
<text x="1262" y="774" font-size="36" fill="#286593" class="bold">业务主链</text>
<text x="1262" y="828" font-size="32" fill="#5B6C79">React 界面 → NestJS 接口 → SQLite 保存</text>
<text x="1262" y="872" font-size="32" fill="#5B6C79">WebSocket 同步旅行变更；权限控制读写</text>
<line x1="1262" y1="926" x2="2398" y2="926" stroke="#D8DFDF" stroke-width="2"/>
<text x="1262" y="990" font-size="36" fill="#286593" class="bold">地图与地点来自组合服务</text>
<text x="1262" y="1044" font-size="32" fill="#5B6C79">地点：TREK Places（Overture）＋ OSM</text>
<text x="1262" y="1088" font-size="32" fill="#5B6C79">可选 Google / 高德补充</text>
<text x="1262" y="1132" font-size="32" fill="#5B6C79">地图：Leaflet / MapLibre / Mapbox 接入</text>
<line x1="1262" y1="1191" x2="2398" y2="1191" stroke="#D8DFDF" stroke-width="2"/>
<text x="1262" y="1255" font-size="36" fill="#286593" class="bold">路线分成三件事</text>
<text x="1262" y="1309" font-size="32" fill="#5B6C79">最近邻＋2-opt：排列地点顺序</text>
<text x="1262" y="1353" font-size="32" fill="#5B6C79">OSRM：计算道路、距离与估计时间</text>
<text x="1262" y="1397" font-size="32" fill="#5B6C79">外部地图：承接实际导航</text>
<line x1="1262" y1="1456" x2="2398" y2="1456" stroke="#D8DFDF" stroke-width="2"/>
<text x="1262" y="1520" font-size="36" fill="#286593" class="bold">运行与外部依赖</text>
<text x="1262" y="1574" font-size="32" fill="#5B6C79">PWA 缓存＋部分离线编辑</text>
<text x="1262" y="1618" font-size="32" fill="#5B6C79">AI / MCP 按配置启用</text>
<text x="1262" y="1662" font-size="32" fill="#5B6C79">照片、天气、汇率、预订解析各有服务依赖</text>
<rect x="1262" y="1737" width="1136" height="114" rx="14" fill="#EAF2F8"/>
<text x="1288" y="1781" font-size="29" fill="#286593" class="bold">重点</text>
<text x="1288" y="1827" font-size="33" fill="#122C43" class="bold">旅行业务整合 ≠ 自研地图与导航引擎</text>
<text x="2522" y="774" font-size="36" fill="#22755E" class="bold">原版实测</text>
<rect x="3538" y="738" width="160" height="47" rx="23" fill="#E8F3ED"/>
<text x="3559" y="771" font-size="25" fill="#22755E" class="bold">已完成</text>
<text x="2522" y="828" font-size="32" fill="#5B6C79">地图联动、道路、分账、清单与刷新保存</text>
