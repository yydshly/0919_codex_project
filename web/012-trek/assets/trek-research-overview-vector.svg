<text x="142" y="774" font-size="36" fill="#286593" class="bold">地点与地图</text>
<text x="142" y="828" font-size="32" fill="#5B6C79">搜索地点、周边分类探索、地图选点</text>
<text x="142" y="872" font-size="32" fill="#5B6C79">照片与收藏</text>
