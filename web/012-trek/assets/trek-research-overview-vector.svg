<text x="1266" y="628" font-size="40" fill="#FFFDF8" class="bold">02</text>
<text x="1348" y="628" font-size="44" fill="#122C43" class="bold">底层怎样工作</text>
<text x="1262" y="682" font-size="29" fill="#5B6C79">旅行业务、地图服务与持久化各有职责</text>
<line x1="1262" y1="709" x2="2398" y2="709" stroke="#D8DFDF" stroke-width="2"/>
<rect x="2480" y="547" width="1260" height="1358" rx="24" fill="#FFFDF8" stroke="#D8DFDF" stroke-width="2"/>
