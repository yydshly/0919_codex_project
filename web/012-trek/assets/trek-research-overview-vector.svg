<svg xmlns="http://www.w3.org/2000/svg" width="3840" height="2880" viewBox="0 0 3840 2880" role="img" aria-labelledby="title desc">
<title id="title">TREK 研究全景图</title>
<desc id="desc">从旅行管理基础，到可信城市导览。汇总 TREK 原生能力、实现原理、本地研究、可扩展目标和对产品负责人的意义。当前暂停产品实现。</desc>
<style>text{font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif} .bold{font-weight:700}</style>
<rect x="0" y="0" width="3840" height="2880" rx="0" fill="#F5F2EA"/>
<rect x="100" y="92" width="10" height="110" rx="4" fill="#286593"/>
<text x="139" y="180" font-size="96" fill="#122C43" class="bold">TREK 研究全景图</text>
<text x="142" y="250" font-size="43" fill="#5B6C79">从旅行管理基础，到可信城市导览</text>
