<text x="2102.6" y="2366.94" font-size="29" fill="#64717B" class="bold">地点关联</text>
<text x="142" y="2444" font-size="32" fill="#122C43" class="bold">核心规则</text>
<text x="318" y="2444" font-size="31" fill="#5B6C79">同一地点编号连接插画、地图、详情与行程；票务资料独立更新</text>
<text x="142" y="2512" font-size="32" fill="#122C43" class="bold">可延伸</text>
<text x="318" y="2512" font-size="31" fill="#5B6C79">多城首访、街区与景区导览、亲子或轻体力路线</text>
<text x="142" y="2580" font-size="32" fill="#122C43" class="bold">需要补齐</text>
<text x="318" y="2580" font-size="31" fill="#5B6C79">入口核实、信息时效、图像质量、推荐依据、国内地图适配</text>
<text x="2492" y="2150" font-size="32" fill="#22755E" class="bold">工程价值</text>
<text x="2682" y="2150" font-size="30" fill="#5B6C79">复用旅行业务与保存接口</text>
<text x="2682" y="2191" font-size="30" fill="#5B6C79">降低从零搭建成本</text>
<text x="2492" y="2272" font-size="32" fill="#22755E" class="bold">产品价值</text>
<text x="2682" y="2272" font-size="30" fill="#5B6C79">把精力放在“帮人选去处</text>
<text x="2682" y="2313" font-size="30" fill="#5B6C79">＋提供可信行动信息”</text>
<text x="2492" y="2394" font-size="32" fill="#22755E" class="bold">研究资产</text>
<text x="2682" y="2394" font-size="30" fill="#5B6C79">原版实测、V1 归档、数据、素材</text>
<text x="2682" y="2435" font-size="30" fill="#5B6C79">和失败案例可继续复用</text>
<text x="2492" y="2516" font-size="32" fill="#22755E" class="bold">下一次决策</text>
<text x="2682" y="2516" font-size="30" fill="#5B6C79">先判断是否帮助用户选得更快、去得更明白</text>
<text x="2682" y="2557" font-size="30" fill="#5B6C79">再决定继续投入</text>
<line x1="100" y1="2685" x2="3740" y2="2685" stroke="#122C43" stroke-width="2"/>
<text x="100" y="2730" font-size="31" fill="#122C43" class="bold">边界</text>
<text x="216" y="2730" font-size="31" fill="#122C43" class="bold">搜索 ≠ 个性化推荐   ｜   地点中心 ≠ 已核实入口   ｜   保存预订 ≠ 预约成功</text>
<text x="100" y="2784" font-size="30" fill="#5B6C79">实时票务与交易需另接服务；E2 视觉质量未完成验收</text>
