<text x="2526" y="628" font-size="40" fill="#FFFDF8" class="bold">03</text>
<text x="2608" y="628" font-size="44" fill="#122C43" class="bold">我们已探索到哪里</text>
<text x="2522" y="682" font-size="29" fill="#5B6C79">分清已经完成、候选效果和后续构想</text>
