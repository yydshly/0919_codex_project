<rect x="1330" y="312" width="1180" height="176" rx="20" fill="#E8F3ED"/>
<text x="1367" y="371" font-size="32" fill="#22755E" class="bold">最值得复用</text>
<text x="1367" y="439" font-size="47" fill="#122C43" class="bold">地点 → 行程 → 路线 → 保存</text>
