<text x="2522" y="1232" font-size="32" fill="#5B6C79">真实资料、图片、地图和出行信息</text>
<text x="2522" y="1276" font-size="32" fill="#5B6C79">用同一地点编号串联</text>
<line x1="2522" y1="1326" x2="3698" y2="1326" stroke="#D8DFDF" stroke-width="2"/>
