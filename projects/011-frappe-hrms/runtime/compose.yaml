name: research-frappe-hrms
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: ${HRMS_DB_PASSWORD:?Use the local runtime env file}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --skip-character-set-client-handshake]
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 5s
      timeout: 5s
      retries: 30
  redis:
    image: redis:7-alpine
  app:
    image: frappe/bench:latest
    user: root
    working_dir: /home/frappe/hrms-workspace
    command: [bash, /workspace/start.sh]
    environment:
      HRMS_DB_PASSWORD: ${HRMS_DB_PASSWORD}
      HRMS_ADMIN_PASSWORD: ${HRMS_ADMIN_PASSWORD}
      SHELL: /bin/bash
      CI: "1"
      UV_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
      UV_HTTP_TIMEOUT: "120"
      UV_HTTP_RETRIES: "5"
      UV_LINK_MODE: copy
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - bench:/home/frappe/hrms-workspace
      - .:/workspace:ro
    ports:
      - 127.0.0.1:8191:8000
      - 127.0.0.1:9191:9191
volumes:
  database:
  bench:
