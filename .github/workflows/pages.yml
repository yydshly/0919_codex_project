name: Deploy research demos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - name: Validate research index
        run: python scripts/project.py check
      - name: Build BrightBean research page
        run: python projects/002-brightbean-studio/scripts/build_web.py
      - name: Build LLM foundations and Agent-Kernel research page
        run: python projects/003-llm-foundations-agent-kernel/scripts/build_web.py
      - name: Build Blinko deployment research page
        run: python projects/004-blinko/scripts/build_web.py
      - name: Build Y2A-Auto research page
        run: python projects/005-y2a-auto/scripts/build_web.py
      - name: Build Leak Check capability showcase
        run: python projects/006-leak-check/scripts/build_web.py
      - name: Build Ebook Treasure Chest summary page
        run: python projects/007-ebook-treasure-chest/scripts/build_web.py
      - name: Build VideoCaptioner research page
        run: python projects/008-videocaptioner/scripts/build_web.py
      - name: Build JoyAI Video Edit research page
        run: python projects/009-joyai-video-edit/scripts/build_web.py
      - name: Build Ziwei Doushu findings page
        run: python projects/010-ziwei-doushu/scripts/build_web.py
      - name: Build VoxCPM2 research page
        run: python projects/017-voxcpm/scripts/build_web.py
      - name: Build Shadowrocket Rules research page
        run: python projects/013-shadowrocket-rules/scripts/build_web.py
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/001-video-shotcraft/package-lock.json
      - name: Build Shotcraft demo
        working-directory: projects/001-video-shotcraft
        run: |
          npm ci
          npm run build:web
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
